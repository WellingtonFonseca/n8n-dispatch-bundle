mautic.n8ndispatch.settings.alerts.tab="Alerts"
mautic.n8ndispatch.settings.alerts.enabled="Send alerts to n8n"
mautic.n8ndispatch.settings.alerts.enabled.tooltip="When on, Mautic posts an alert to the same webhook as the dispatches, with the header X-N8n-Dispatch-Action set to: alert.campaign.unpublished, alert.campaign.failure_warning, alert.campaign.bounce_spike, alert.status_poll.failed or alert.dispatch.resend_failed. Route them in n8n (Teams, email, WhatsApp). It needs the webhook above and n8n up."
mautic.n8ndispatch.settings.alerts.instance_name="Name of this instance"
mautic.n8ndispatch.settings.alerts.instance_name.tooltip="Sent with every alert, in the instance field, so n8n can tell in Teams which instance has the problem. Example: Mautic Sales. Empty, the alert goes out with an empty instance."
mautic.n8ndispatch.settings.alerts.warning_percent="Warn when a step fails for (% of the contacts)"
mautic.n8ndispatch.settings.alerts.warning_percent.tooltip="Mautic switches a campaign off at 10%. The warning (alert.campaign.failure_warning) comes before that, once a day per campaign. 1 to 9."
mautic.n8ndispatch.settings.alerts.warning_min="No warning below this many contacts in the campaign"
mautic.n8ndispatch.settings.alerts.warning_min.tooltip="A small campaign is switched off by a few failures, before a warning helps. Under this number the warning is not sent (the alert of the switch-off still is)."
mautic.n8ndispatch.settings.alerts.bounce_percent="Alert when bounces reach (% of the Emails sent)"
mautic.n8ndispatch.settings.alerts.bounce_percent.tooltip="Contacts of a campaign that bounced, as a share of the contacts that got its Email step in the window below (alert.campaign.bounce_spike). Once every 6 hours per campaign."
mautic.n8ndispatch.settings.alerts.bounce_window="Bounce window (minutes)"
mautic.n8ndispatch.settings.alerts.bounce_window.tooltip="Only the Emails sent and the bounces of the last minutes count. 60 = 1 hour."
mautic.n8ndispatch.settings.alerts.bounce_min="No bounce alert below this many Emails in the window"
mautic.n8ndispatch.settings.alerts.bounce_min.tooltip="Volume decides: with few Emails one bounce is a big share. Under this number the campaign is not checked."
