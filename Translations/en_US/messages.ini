mautic.n8ndispatch.settings.status_poll.timeout="Timeout without a response (seconds)"
mautic.n8ndispatch.settings.status_poll.timeout.tooltip="How long Mautic waits for n8n to answer a call before giving up. If a call is cut, the run stops and the next one asks again. Keep it well above how long n8n takes to answer one call. 10 to 900."
mautic.n8ndispatch.settings.status_poll.max_duration="Longest a call may last (seconds)"
mautic.n8ndispatch.settings.status_poll.max_duration.tooltip="The most a whole call may last, even if n8n keeps sending data. Never shorter than the timeout above."

