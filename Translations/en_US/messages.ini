mautic.n8ndispatch.settings.email_send_mode="Send Email through"
mautic.n8ndispatch.settings.email_send_mode.n8n="n8n (webhook)"
mautic.n8ndispatch.settings.email_send_mode.mautic="Mautic (its own mailer)"
mautic.n8ndispatch.settings.email_send_mode.tooltip="Where the Email of a campaign step goes out on this Mautic. n8n: the webhook, as before. Mautic: Mautic's own mailer (SMTP), with its own tracking, unsubscribe and bounce handling. SMS and HSM always go through n8n."
mautic.n8ndispatch.settings.status_poll.enabled="Check the status of dispatches (callback)"
mautic.n8ndispatch.settings.status_poll.enabled.tooltip="When on, Mautic asks n8n how each Email, SMS and HSM dispatch ended up and shows it on the contact's Timeline. It runs by itself on Mautic's own cron, no extra setup."
mautic.n8ndispatch.settings.status_poll.interval="Check every (minutes)"
mautic.n8ndispatch.settings.status_poll.interval.tooltip="60 = 1 hour, 120 = 2 hours. It cannot be faster than Mautic's own cron, which usually runs every 15 minutes. Minimum 5."
mautic.n8ndispatch.settings.status_poll.last_run="Last run"
mautic.n8ndispatch.settings.status_poll.last_run.never="Not run yet"
mautic.n8ndispatch.settings.status_poll.last_run.line="%date% — %status% — %summary%"
mautic.n8ndispatch.settings.status_poll.last_run.stale="WARNING: no run for a long time, Mautic's cron may not be running."
mautic.n8ndispatch.settings.status_poll.status.running="running"
mautic.n8ndispatch.settings.status_poll.status.ok="ok"
mautic.n8ndispatch.settings.status_poll.status.error="error"
mautic.n8ndispatch.settings.status_poll.check_now="Check now"
mautic.n8ndispatch.settings.status_poll.batch="Ids per call to n8n"
mautic.n8ndispatch.settings.status_poll.batch.tooltip="How many ids go in each call. Each run asks about the whole queue, this many at a time, one call after the other. Smaller calls answer faster. 10 to 1000."
mautic.n8ndispatch.settings.status_poll.delay="Pause between calls to n8n (milliseconds)"
mautic.n8ndispatch.settings.status_poll.delay.tooltip="How long to wait between two calls to n8n, also from one channel to the next, so n8n is not hit with all the batches at once. 0 = no pause. Does not limit how often a run may start (that is the interval). It also applies to \"Check now\" (between the channels) and to the command by hand: set 0 to ask without waiting, for example when testing. 0 to 60000."
mautic.n8ndispatch.settings.status_poll.timeout="Timeout without a response (seconds)"
mautic.n8ndispatch.settings.status_poll.timeout.tooltip="How long Mautic waits for n8n to answer a call before giving up. If a call is cut, the run stops and the next one asks again. Keep it well above how long n8n takes to answer one call. 10 to 900."
mautic.n8ndispatch.settings.status_poll.max_duration="Longest a call may last (seconds)"
mautic.n8ndispatch.settings.status_poll.max_duration.tooltip="The most a whole call may last, even if n8n keeps sending data. Never shorter than the timeout above."
mautic.n8ndispatch.settings.mirror_resync.enabled="Send Emails out of sync to Mirror again"
mautic.n8ndispatch.settings.mirror_resync.enabled.tooltip="When on, Mautic sends again to n8n (email.save) the Emails whose last sync failed, never happened or is out of date, one at a time. Saving an Email never waits for it. It runs by itself on Mautic's own cron and never at the same time as the status check."
mautic.n8ndispatch.settings.mirror_resync.interval="Check every (minutes)"
mautic.n8ndispatch.settings.mirror_resync.interval.tooltip="120 = 2 hours. It cannot be faster than Mautic's own cron, which usually runs every 15 minutes. 30 to 1440."
mautic.n8ndispatch.settings.mirror_resync.batch="Most Emails per run"
mautic.n8ndispatch.settings.mirror_resync.batch.tooltip="Each Email is one call to n8n. The most urgent go first: failed, never sent, changed, then the oldest. The rest waits for the next run. 10 to 1000."
mautic.n8ndispatch.settings.mirror_resync.delay="Pause between calls to n8n (milliseconds)"
mautic.n8ndispatch.settings.mirror_resync.delay.tooltip="How long to wait between two Emails, so n8n gets one call at a time. 0 to 60000."
mautic.n8ndispatch.settings.mirror_resync.refresh_hours="Send an Email in sync again after (hours)"
mautic.n8ndispatch.settings.mirror_resync.refresh_hours.tooltip="24 = every Email goes to Mirror again once a day, spread over the runs. 6 to 168."
mautic.n8ndispatch.settings.mirror_resync.last_run="Last Mirror resync"

