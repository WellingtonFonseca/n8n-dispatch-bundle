mautic.n8ndispatch.settings.status_poll.enabled.tooltip="Quando ligado, o Mautic pergunta ao n8n como cada disparo de Email, SMS e HSM terminou e mostra na Timeline do contato. Roda sozinho no cron do próprio Mautic, sem configuração extra."
