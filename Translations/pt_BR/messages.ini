mautic.n8ndispatch.settings.status_poll.batch.tooltip="Quantos ids vão em cada chamada. Cada rodada pergunta a fila inteira, esta quantidade por vez, uma chamada depois da outra. Chamadas menores respondem mais rápido. De 10 a 1000."
mautic.n8ndispatch.settings.status_poll.delay="Pausa entre chamadas ao n8n (milissegundos)"
mautic.n8ndispatch.settings.status_poll.delay.tooltip="Quanto esperar entre duas chamadas ao n8n, também de um canal para o seguinte, para que o n8n não receba todos os lotes de uma vez. 0 = sem pausa. Não limita de quanto em quanto tempo uma rodada pode começar (isso é o intervalo). Vale também para \"Verificar agora\" (entre os canais) e para o comando manual: use 0 para perguntar sem esperar, por exemplo ao testar. De 0 a 60000."
mautic.n8ndispatch.settings.status_poll.timeout="Timeout sem resposta (segundos)"
mautic.n8ndispatch.settings.status_poll.timeout.tooltip="Quanto o Mautic espera o n8n responder uma chamada antes de desistir. Se uma chamada for cortada, a rodada para e a próxima pergunta de novo. Mantenha bem acima do tempo que o n8n leva para responder uma chamada. De 10 a 900."
mautic.n8ndispatch.settings.status_poll.max_duration="Duração máxima de uma chamada (segundos)"
mautic.n8ndispatch.settings.status_poll.max_duration.tooltip="O máximo que uma chamada inteira pode durar, mesmo que o n8n continue mandando dados. Nunca menor que o timeout acima."

